syntax = "proto3";

package greet.v1;

// GreetService is a tiny gRPC service used to learn the basics:
// one unary RPC and one server-streaming RPC.
service GreetService {
  // SayHello returns a single greeting.
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse) {}

  // SayHelloStream streams a greeting back one word at a time.
  rpc SayHelloStream(SayHelloRequest) returns (stream SayHelloResponse) {}
}

message SayHelloRequest {
  string name = 1;
}

message SayHelloResponse {
  string greeting = 1;
}
